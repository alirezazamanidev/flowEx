version: '3.9'

services:
  db:
    image: postgres:17.4-alpine
    env_file:
      - .env
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: 1111
      POSTGRES_DB: FlowEx
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  redis:
    image: redis:7.4.1-alpine3.20
    ports:
      - "6379:6379"

volumes:
  db_data:
