syntax = "proto3";

package wallet;
import "user.proto";
message DepositDto{
    User user=1;
    string amount=2;

}
message DepositResponse{
    string gatewayUrl=1;
}
message verifyPaymentDto {
    string authority=1;
    string status=2;
}
message VerifyPaymentResponse {
    string url=1;
}

message LockFundsRequest {
  string userId = 1;
  string currency=2;
  double percent = 3;
  string side =4;
}

message LockFundsResponse {
  bool success = 1;
  string message=2;
  double amount = 4;

}

service WalletService {
  rpc Deposit (DepositDto) returns (DepositResponse);
  rpc VerifyPayment(verifyPaymentDto) returns (VerifyPaymentResponse);
  rpc LockFunds(LockFundsRequest) returns(LockFundsRequest);
}   