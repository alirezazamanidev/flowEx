
syntax = "proto3";
package user;

message SignUpDto {
  string username = 1;
  string email = 2;
  string password = 3;
}
message SignInDto {
  string email = 1;
  string password = 2;
}
message CheckOtpDto {
  string email = 1;
  string otpCode = 2;
}
message AuthResponse {
  string message = 1;
}
message VerifyOtpResponse{
 string  message =1;
 string jwtToken = 2; 
}
message Empty {}

service AuthService {
  rpc SignUp(SignUpDto) returns (AuthResponse);
  rpc SignIn(SignInDto) returns (AuthResponse);
  rpc CheckOtp(CheckOtpDto) returns (VerifyOtpResponse);
}